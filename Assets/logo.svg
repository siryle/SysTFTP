<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#020817" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020817" flood-opacity="0.35"/>
    </filter>

    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="96" y="96" width="832" height="832" rx="192" ry="192"/>
    </clipPath>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="75%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="96" y="96" width="832" height="832" rx="192" ry="192" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Masked Content inside Squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- Radial Ambient Core Glow -->
    <circle cx="512" cy="512" r="380" fill="url(#centerGlow)"/>

    <!-- Subtle Grid / Telemetry Matrix Pattern (Network engineering motif) -->
    <path d="M96 300 H928 M96 512 H928 M96 724 H928 M300 96 V928 M512 96 V928 M724 96 V928" 
          stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" stroke-dasharray="8 8"/>

    <!-- Syslog Radar Rings (Concentric Circles representing Syslog / Telemetry Daemon) -->
    <circle cx="512" cy="512" r="310" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-dasharray="12 12"/>
    <circle cx="512" cy="512" r="230" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2.5" fill="none"/>
    <circle cx="512" cy="512" r="150" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-dasharray="6 6"/>

    <!-- Syslog Radar Pulse Nodes (Real-time telemetry event points) -->
    <circle cx="680" cy="380" r="6" fill="#34D399" filter="url(#neonBlur)"/>
    <circle cx="370" cy="620" r="5" fill="#38BDF8" filter="url(#neonBlur)"/>
    <circle cx="620" cy="650" r="5.5" fill="#F59E0B" filter="url(#neonBlur)"/>
    <circle cx="390" cy="390" r="4.5" fill="#A78BFA" filter="url(#neonBlur)"/>

    <!-- Central Router / Gateway Hexagonal Hub Shield -->
    <polygon points="512,230 730,356 730,608 512,734 294,608 294,356" 
             fill="#0B132B" fill-opacity="0.82" stroke="url(#metalRim)" stroke-width="4" filter="url(#softGlow)"/>

    <polygon points="512,250 710,366 710,598 512,714 314,598 314,366" 
             fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- TFTP & FTP High-Speed Bidirectional Transmission Glyphs -->
    
    <!-- Upload Arrow (Left / Cyan Gradient: TFTP / FTP Upload) -->
    <g filter="url(#neonBlur)">
      <path d="M430 610 V430 H365 L445 295 L525 430 H460 V610 Z" fill="url(#cyanGlow)"/>
    </g>
    <!-- Sharp overlay for crispness -->
    <path d="M430 610 V430 H365 L445 295 L525 430 H460 V610 Z" fill="#E0F2FE" opacity="0.9"/>

    <!-- Download Arrow (Right / Emerald Gradient: TFTP / FTP Download) -->
    <g filter="url(#neonBlur)">
      <path d="M565 370 V550 H500 L580 685 L660 550 H595 V370 Z" fill="url(#emeraldGrad)"/>
    </g>
    <!-- Sharp overlay for crispness -->
    <path d="M565 370 V550 H500 L580 685 L660 550 H595 V370 Z" fill="#D1FAE5" opacity="0.9"/>

    <!-- 4 Daemon Status Node Badges (TFTP Server, TFTP Client, FTP Server, Syslog) -->
    <!-- Top: TFTP Server Node -->
    <circle cx="512" cy="180" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="512" cy="180" r="5" fill="#FFFFFF"/>

    <!-- Right: FTP Server Node -->
    <circle cx="780" cy="512" r="14" fill="#0D9488" stroke="#34D399" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="780" cy="512" r="5" fill="#FFFFFF"/>

    <!-- Bottom: Syslog Server Node -->
    <circle cx="512" cy="800" r="14" fill="#7C3AED" stroke="#C084FC" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="512" cy="800" r="5" fill="#FFFFFF"/>

    <!-- Left: TFTP Client Node -->
    <circle cx="244" cy="512" r="14" fill="#0284C7" stroke="#60A5FA" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="244" cy="512" r="5" fill="#FFFFFF"/>

    <!-- Connecting Fiber lines to nodes -->
    <line x1="512" y1="194" x2="512" y2="230" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="730" y1="512" x2="766" y2="512" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="512" y1="734" x2="512" y2="786" stroke="#C084FC" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="258" y1="512" x2="294" y2="512" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Elegant Apple-style top glass reflection highlight -->
    <path d="M110 110 C 230 96, 794 96, 914 110 C 922 170, 922 280, 890 350 C 720 280, 304 280, 134 350 C 102 280, 102 170, 110 110 Z" 
          fill="#FFFFFF" opacity="0.08"/>

    <!-- Inner Border Stroke for macOS Big Sur continuous curvature depth -->
    <rect x="96" y="96" width="832" height="832" rx="192" ry="192" fill="none" stroke="url(#metalRim)" stroke-width="3"/>
  </g>
</svg>